services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online-cinema-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: online-cinema-postgres
    environment:
      POSTGRES_DB: online_cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online_cinema"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: online-cinema-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online-cinema-celery-worker
    entrypoint: [ ]
    command: celery -A celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    working_dir: /app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online-cinema-celery-beat
    entrypoint: [ ]
    command: poetry run celery -A celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    working_dir: /app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

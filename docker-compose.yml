services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online-cinema-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: online-cinema-postgres
    environment:
      POSTGRES_DB: online_cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online_cinema"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
